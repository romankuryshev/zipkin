# This file uses the version 2 docker compose file format, described here:
# https://docs.docker.com/compose/compose-file/#version-2
#
# This runs the zipkin and zipkin-mysql containers, using docker-compose's
# default networking to wire the containers together.
#
# Note that this file is meant for learning Zipkin, not production deployments.

version: '2.4'

services:
  storage:
    image: mysql:8.4
    container_name: mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=zipkin
      - MYSQL_DATABASE=zipkin
      - MYSQL_USER=zipkin
      - MYSQL_PASSWORD=zipkin
    volumes:
      - ../../zipkin-storage/mysql-v1/src/main/resources/mysql.sql:/docker-entrypoint-initdb.d/zipkin.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uzipkin", "-pzipkin", "zipkin", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Use MySQL instead of in-memory storage
#  zipkin:
#    extends:
#      file: docker-compose.yml
#      service: zipkin
#    # slim doesn't include MySQL support, so switch to the larger image
#    image: ghcr.io/openzipkin/zipkin:${TAG:-latest}
#    environment:
#      - STORAGE_TYPE=mysql
#      - MYSQL_HOST=storage
#      # Add the baked-in username and password for the zipkin-mysql image
#      - MYSQL_USER=zipkin
#      - MYSQL_PASS=zipkin
#    depends_on:
#      storage:
#        condition: service_healthy

  dependencies:
    extends:
      file: docker-compose-dependencies.yml
      service: dependencies
    environment:
      - STORAGE_TYPE=mysql
      - MYSQL_HOST=storage
      # Add the baked-in username and password for the zipkin-mysql image
      - MYSQL_USER=zipkin
      - MYSQL_PASS=zipkin
    depends_on:
      storage:
        condition: service_healthy
